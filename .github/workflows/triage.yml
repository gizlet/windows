name: PR triage

# Starts pull-request CI and Codex review with a comment. Opening, updating,
# reopening or readying a pull request from a branch in this repository makes
# gizlet-bot comment each command below on its own line, for the current head.
# The gated workflows listen to comments and start from it; a writer's comment
# with the same command runs one again. Runs on a GitHub-hosted runner and
# never checks out pull-request code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: read
    uses: gizlet/.github/.github/workflows/pr-triage.yml@latest
    with:
      # One command per line; each gated workflow runs for its own.
      commands: |
        /ci
        /codex-review
      client-id: ${{ vars.GIZLET_BOT_CLIENT_ID }}
    secrets:
      GIZLET_BOT_PRIVATE_KEY: ${{ secrets.GIZLET_BOT_PRIVATE_KEY }}
