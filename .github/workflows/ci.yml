name: CI

# Command-gated CI. Pull requests run it from a comment with a `/ci` line,
# posted by gizlet-bot when the pull request is opened or updated, or by a
# writer to run it again. Comment events run this file from the default
# branch, so a pull request cannot rewrite its own required check. Do not add
# a pull_request trigger. The build itself is scripts/ci.ps1 at the tested
# commit.

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to run for; leave empty to run on the selected branch.
        required: false
        default: ''
        type: string
      head_sha:
        description: Expected pull-request head; a moved head is skipped.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  start:
    # Every new comment starts this workflow; only one with a /ci line goes on.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, '/ci'))
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: gizlet/.github/.github/workflows/pr-check-start.yml@latest
    with:
      check-name: CI
      command: /ci
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}

  build:
    name: Build and test (Windows x64)
    needs: start
    if: >-
      !cancelled() && (
        needs.start.outputs.run == 'true'
        || (needs.start.result == 'skipped' && github.event_name != 'issue_comment'))
    # The RUNNERS organization variable maps platforms to self-hosted runners.
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}')['windows-x64'] || 'windows-2025' }}
    timeout-minutes: 60
    # The job runs pull-request code: read-only token and no secrets.
    permissions:
      contents: read
    concurrency:
      group: ci-${{ needs.start.outputs.number || github.ref }}
      cancel-in-progress: ${{ needs.start.outputs.number != '' }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.start.outputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build and test
        shell: pwsh
        run: ./scripts/ci.ps1

  finish:
    needs: [start, build]
    if: always() && needs.start.outputs.run == 'true'
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: gizlet/.github/.github/workflows/pr-check-finish.yml@latest
    with:
      check_run_id: ${{ needs.start.outputs.check_run_id }}
      comment_id: ${{ needs.start.outputs.comment_id }}
      result: ${{ needs.build.result }}
