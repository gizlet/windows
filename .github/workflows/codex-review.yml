name: Codex review

# Reviews the pull-request diff with Codex and reports the `Codex Code Review`
# check. It runs for a comment with a `/codex-review` line, posted by gizlet-bot
# when the pull request is opened or updated, or by a writer to review again.
# Runs on GitHub-hosted runners and never executes pull-request code.
# See https://github.com/gizlet/.github.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to review.
        required: false
        default: ''
        type: string
      head_sha:
        description: Expected pull-request head; a moved head is skipped.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  review:
    # Every new comment starts this workflow; only one with a /codex-review line goes on.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, '/codex-review'))
    concurrency:
      group: codex-review-${{ inputs.pull_request_number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: gizlet/.github/.github/workflows/codex-review.yml@latest
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}
      review-instructions: >-
        Gizlet Launcher for Windows: a C#/.NET WinUI 3 desktop app that installs
        and runs Gizlet Store packages (.gzl), keeps per-profile saves and
        settings, updates itself from a signed manifest on dl.gizlet.io, and
        flashes Gizlet OS images to R36S SD cards through an elevated helper.
        Prioritise, in this order: (1) disk-write target validation: the helper
        must never write to a system, boot, fixed or non-USB/SD/MMC disk, must
        re-identify the chosen card after elevation and refuse when it changed
        or was re-inserted, and must lock and dismount every volume first;
        (2) the UAC boundary: the Launcher runs unelevated, only the signed
        helper elevates, and the helper treats its request, image file and
        pipe input as untrusted; (3) update verification: the SSH signature of
        the manifest, its version ordering, the installer's size, SHA-256 and
        Authenticode publisher must all be checked before anything runs;
        (4) profile data: installs, updates and uninstalls must never delete or
        mix another profile's saves, favourites or settings, and package paths
        must not escape their folder. Also flag release-workflow changes that
        expose signing or R2 credentials to pull-request code.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
