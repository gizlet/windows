name: UI trial
on:
  push:
    branches: [codex/ui-check]
permissions:
  contents: read
jobs:
  ui:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - shell: pwsh
        run: |
          ./scripts/install-inno.ps1
          $installer = ./scripts/package.ps1 -Version 0.0.1 -Arch x64 -Output artifacts | Select-Object -Last 1
          $p = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer $($p.ExitCode)" }
          ./scripts/ui-check.ps1 -Launcher "$env:LOCALAPPDATA\Programs\Gizlet Launcher\Gizlet.Launcher.exe" -Output ui
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui
          path: ui
